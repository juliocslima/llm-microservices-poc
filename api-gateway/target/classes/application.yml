spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates: [Path=/orders/**]
          filters: [StripPrefix=0]

        - id: payment-service
          uri: http://localhost:8082
          predicates: [Path=/payments/**]

        - id: inventory-service
          uri: http://localhost:8083
          predicates: [Path=/inventory/**]

        - id: notification-service
          uri: http://localhost:8084
          predicates: [Path=/notifications/**]

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
