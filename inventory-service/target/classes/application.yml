spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/poc
    username: poc
    password: poc123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: poc
    password: poc123

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

app:
  artificial-delay-ms: 0   # set > 0 for S2 (high latency) scenario
