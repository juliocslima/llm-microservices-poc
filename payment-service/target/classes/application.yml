spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/poc
    username: poc
    password: poc123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: poc
    password: poc123

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# Fault injection flag - set to true to simulate service unavailability
app:
  fault-injection:
    enabled: false
    type: NONE   # NONE | UNAVAILABLE | SLOW
    delay-ms: 0
