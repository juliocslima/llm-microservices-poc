spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/poc
    username: poc
    password: poc123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: poc
    password: poc123
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
  service:
    name: order-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} spanId=%X{spanId} - %msg%n"
  level:
    br.ufla.poc: DEBUG
    org.springframework: INFO

app:
  payment-service-url: http://localhost:8082
  inventory-service-url: http://localhost:8083
  rabbitmq:
    exchange: poc.events
    routing:
      order-created: order.created
      order-paid: order.paid
