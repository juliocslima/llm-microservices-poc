# =============================================================================
# experiment-config.yml
# Configuração do experimento e do ambiente de reprodução — SBCARS 2026
# =============================================================================

experiment:
  name: "GTAA-LM — Avaliação Empírica"
  venue: "SBCARS 2026 — 20º Simpósio Brasileiro de Componentes, Arquiteturas e Reutilização de Software"
  date: "2026-05-31"
  executions: 30         # rodadas completas executadas no experimento reportado
  scenarios: 6           # cenários por rodada
  total_scenario_executions: 180

artifact:
  repository: "https://github.com/juliocslima/llm-microservices-poc"
  doi: "10.5281/zenodo.21853147"
  target_badges: [Available, Functional]

# Ambiente usado nas execuções reportadas no artigo.
reported_experiment_environment:
  llm_hosting: external-local-network
  ollama_endpoint: "http://192.168.10.20:11434"
  note: >
    Este endpoint registra a configuração histórica usada nas execuções reportadas.
    Ele NÃO é necessário para a reprodução do artefato.

# Ambiente portátil oferecido ao avaliador do artefato.
artifact_reproduction_environment:
  llm_hosting: docker
  ollama_endpoint: "http://ollama:11434"
  compose_file: docker-compose.yml
  network: poc-net
  note: >
    O Docker Compose inicia o Ollama e baixa automaticamente o modelo llama3:8b.

model:
  name: llama3:8b
  provider: Ollama
  parameters:
    temperature: 0.1
    top_p: 0.9
    seed: 42
    num_predict: 2048
    num_ctx: 8192
  reproducibility_note: >
    Registre, na release congelada, a versão exata do Ollama e o digest do modelo
    obtidos no ambiente efetivamente validado.

agent:
  framework: LangChain4j 0.32
  pattern: "ReAct (Reasoning + Acting) — implementação manual"
  max_iterations: 12
  min_tool_calls_for_answer: 3
  timeout_per_llm_call_s: 300
  tool_output_truncation: 1500

tools:
  - name: checkAllServicesHealth
    source: Spring Boot Actuator /actuator/health
    timeout_s: 4
  - name: queryLogs
    source: Loki API /loki/api/v1/query_range
  - name: queryLatency
    source: Prometheus API /api/v1/query
  - name: queryHttpStatus
    source: Prometheus API /api/v1/query
  - name: getServiceDependencies
    source: PostgreSQL — tabela service_topology
  - name: getServiceTopology
    source: PostgreSQL — tabela service_topology
  - name: inspectQueues
    source: RabbitMQ Management API /api/queues
  - name: getIncidentHistory
    source: PostgreSQL — tabela incident_history

scenarios:
  S1:
    name: "Serviço de pagamento indisponível"
    injection: "payment-service retornando HTTP 503 via endpoint /api/payments/fault"
    mechanism: "flag em memória no PaymentController, alterado em runtime"
    expected_service: payment-service
    expected_cause_keywords: [unavailable, 503, down, connection]

  S2:
    name: "Alta latência no serviço de estoque"
    injection: "atraso artificial de 3000ms no inventory-service via /api/inventory/fault"
    mechanism: "Thread.sleep() condicional no InventoryController"
    expected_service: inventory-service
    expected_cause_keywords: [latency, slow, delay, timeout, performance]

  S3:
    name: "Acúmulo de mensagens na fila"
    injection: "docker stop poc-notification-service"
    mechanism: "container interrompido — consumidor RabbitMQ ausente"
    expected_service: notification-service
    expected_cause_keywords: [queue, consumer, message, rabbit, accumulated]

  S4:
    name: "Erro de configuração de URL"
    injection: "INVENTORY_SERVICE_URL=http://INVALID-HOST-DOES-NOT-EXIST:9999"
    mechanism: "container alternativo com variável de ambiente incorreta"
    expected_service: order-service
    expected_cause_keywords: [config, invalid, host, misconfiguration, url]

  S5:
    name: "Falha de autenticação inter-serviços"
    injection: "payment-service retornando HTTP 401 Unauthorized via /api/payments/fault"
    mechanism: "flag AUTH_FAILURE no PaymentController"
    expected_service: payment-service
    expected_cause_keywords: [auth, 401, unauthorized, token, credential, bearer]

  S6:
    name: "Banco de dados indisponível"
    injection: "docker stop poc-postgres"
    mechanism: "container PostgreSQL interrompido"
    expected_service: [postgres, order-service, payment-service]
    expected_cause_keywords: [database, postgres, sql, connection, jdbc]
    architectural_finding: >
      Durante S6, o PostgreSQL é simultaneamente alvo da falha e backend da auditoria.
      Assim, a persistência da trilha de auditoria pode ficar indisponível enquanto o
      agente continua executando as ferramentas em memória. Esta limitação é mantida
      explicitamente como parte das ameaças à validade e da discussão arquitetural.

reset_policy:
  between_scenarios:
    - "Desativar fault injection via endpoint HTTP"
    - "Remover poc-order-service-bad, se existir"
    - "Restaurar poc-order-service"
    - "Restaurar poc-notification-service"
    - "Restaurar poc-postgres"
    - "Aguardar estabilização dos serviços"
  between_full_runs:
    - "Executar reset_faults"
    - "Aguardar serviços operacionais"
    - "Gerar tráfego de baseline"

initial_state:
  all_services: running
  databases: [postgres, rabbitmq, redis]
  observability: [prometheus, loki, tempo, grafana, promtail]
  agent_orchestrator: running
  reproduction_llm: "Docker service ollama:11434 — llama3:8b"

evaluation:
  service_correct:
    method: "comparação textual do affectedService com o serviço esperado"
  cause_correct:
    method: "busca case-insensitive por padrões de causa definidos por cenário"
  traceability_score:
    formula: "calculado pelo GovernanceService"
    max: 1.0
  human_approval:
    trigger_patterns: [restart, rollback, terminate, redeploy, scale, shutdown, flush cache]
    implementation: "GovernanceService.evaluate()"
