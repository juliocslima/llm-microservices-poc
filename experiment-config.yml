# =============================================================================
# experiment-config.yml
# Configuração completa do experimento — SBCARS 2026
# Referenciável na seção de avaliação do artigo para fins de reprodutibilidade
# =============================================================================

experiment:
  name: "LLM Agent POC — Avaliação Empírica"
  venue: "SBCARS 2026 — 20º Simpósio Brasileiro de Componentes, Arquiteturas e Reutilização de Software"
  date: "2026-05-31"
  executions: 5          # número de rodadas completas (S1–S6) executadas
  scenarios: 6           # cenários de falha por rodada

# ── Modelo LLM ──────────────────────────────────────────────────────────────
model:
  name: llama3:8b
  provider: Ollama
  version: "0.6.x"       # verificar com: ollama --version no host
  hosting: local-network  # servidor externo em 192.168.10.20:11434
  parameters:
    temperature: 0.1      # baixa temperatura para maior determinismo
    top_p: 0.9            # nucleus sampling
    seed: 42              # semente para reproducibilidade (quando suportado)
    num_predict: 2048     # máximo de tokens gerados por chamada
    num_ctx: 8192         # janela de contexto

# ── Agente ReAct ────────────────────────────────────────────────────────────
agent:
  framework: LangChain4j 0.32
  pattern: ReAct (Reasoning + Acting) — implementação manual
  max_iterations: 12          # iterações máximas por sessão de diagnóstico
  min_tool_calls_for_answer: 3 # ferramentas mínimas antes de Final Answer
  timeout_per_llm_call_s: 300 # timeout por chamada ao modelo
  tool_output_truncation: 1500 # caracteres máximos por Observation

# ── Ferramentas (Tools) ─────────────────────────────────────────────────────
tools:
  - name: checkAllServicesHealth
    source: Spring Boot Actuator /actuator/health
    timeout_s: 4           # timeout por serviço — evita bloqueio quando DB está down
  - name: queryLogs
    source: Loki API /loki/api/v1/query_range
    label_strategy: "{service=<name>} com fallback para {container=poc-<name>}"
  - name: queryLatency
    source: Prometheus API /api/v1/query (PromQL)
    metrics: http_server_requests_seconds_bucket, _count
  - name: queryHttpStatus
    source: Prometheus API /api/v1/query
  - name: getServiceDependencies
    source: PostgreSQL — tabela service_topology
  - name: getServiceTopology
    source: PostgreSQL — tabela service_topology
  - name: inspectQueues
    source: RabbitMQ Management API /api/queues
  - name: getIncidentHistory
    source: PostgreSQL — tabela incident_history

# ── Cenários de falha ────────────────────────────────────────────────────────
scenarios:
  S1:
    name: "Serviço de pagamento indisponível"
    injection: "payment-service retornando HTTP 503 via endpoint /api/payments/fault"
    mechanism: "flag em memória no PaymentController, alterado em runtime"
    expected_service: payment-service
    expected_cause_keywords: [unavailable, 503, down, connection]

  S2:
    name: "Alta latência no serviço de estoque"
    injection: "atraso artificial de 3000ms no inventory-service via /api/inventory/fault"
    mechanism: "Thread.sleep() condicional no InventoryController"
    expected_service: inventory-service
    expected_cause_keywords: [latency, slow, delay, timeout, performance]

  S3:
    name: "Acúmulo de mensagens na fila"
    injection: "docker stop poc-notification-service"
    mechanism: "container interrompido — consumidor RabbitMQ ausente"
    expected_service: notification-service
    expected_cause_keywords: [queue, consumer, message, rabbit, accumulated]

  S4:
    name: "Erro de configuração de URL"
    injection: "INVENTORY_SERVICE_URL=http://INVALID-HOST-DOES-NOT-EXIST:9999"
    mechanism: "container alternativo com variável de ambiente incorreta"
    fallback: "delay extremo de 10s no inventory-service quando docker run falha"
    expected_service: order-service
    expected_cause_keywords: [config, invalid, host, misconfiguration, url]

  S5:
    name: "Falha de autenticação inter-serviços"
    injection: "payment-service retornando HTTP 401 Unauthorized via /api/payments/fault"
    mechanism: "flag AUTH_FAILURE no PaymentController — simula token inter-serviço inválido"
    expected_service: payment-service
    expected_cause_keywords: [auth, 401, unauthorized, token, credential, bearer]
    note: "Diferente de S1 (503): S5 simula falha de autenticação, não indisponibilidade"

  S6:
    name: "Banco de dados indisponível"
    injection: "docker stop poc-postgres"
    mechanism: "container PostgreSQL interrompido"
    expected_service: [postgres, order-service, payment-service]
    expected_cause_keywords: [database, postgres, sql, connection, jdbc]
    architectural_finding: >
      O audit log do AuditService não pôde ser persistido durante este cenário
      porque o próprio PostgreSQL — alvo da falha — é o backend de auditoria.
      Esse achado revela uma dependência circular na arquitetura: o mecanismo
      de rastreabilidade depende do sistema que está sendo observado.
      Resultado: tool_calls reportados = 0 no audit log, embora o agente
      tenha executado as 6 ferramentas na sessão ReAct.

# ── Política de reset entre rodadas ─────────────────────────────────────────
reset_policy:
  between_scenarios:
    - "Desativar fault injection via endpoint HTTP"
    - "docker stop poc-order-service-bad && docker rm poc-order-service-bad (S4)"
    - "docker start poc-order-service (S4)"
    - "docker start poc-notification-service (S3)"
    - "docker start poc-postgres (S6)"
    - "sleep 5 — aguardar estabilização dos containers"
  between_full_runs:
    - "Executar reset_faults completo"
    - "Aguardar health checks verdes em todos os serviços"
    - "Gerar tráfego de baseline (10 pedidos sintéticos)"

# ── Estado inicial dos containers ────────────────────────────────────────────
initial_state:
  all_services: running
  databases: [postgres, rabbitmq, redis]
  observability: [prometheus, loki, tempo, grafana, promtail]
  agent_orchestrator: running
  external_llm_server: "192.168.10.20:11434 — modelo llama3:8b pré-carregado"

# ── Critérios de avaliação ────────────────────────────────────────────────────
evaluation:
  service_correct:
    method: "grep -qiE no campo affectedService da resposta JSON"
    note: "usa padrão ERE para permitir alternação (postgres|order|payment)"
  cause_correct:
    method: "grep -qiE no campo probableCause com padrões por cenário"
    note: "múltiplos sinônimos por padrão para cobrir variabilidade lexical do modelo"
  traceability_score:
    formula: "min(tool_calls/5, 0.3) + min(evidence_count/4, 0.4) + structure_score * 0.075"
    structure_fields: [affectedService, probableCause, recommendedActions, evidenceUsed]
    max: 1.0
  human_approval:
    trigger_patterns: [restart, rollback, terminate, redeploy, scale, shutdown, flush cache]
    implementation: GovernanceService.evaluate() — regex sobre recomendações do agente
