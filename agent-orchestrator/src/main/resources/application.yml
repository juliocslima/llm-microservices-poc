spring:
  application:
    name: agent-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/poc
    username: poc
    password: poc123
    hikari:
      connection-timeout: 3000       # 3s max wait for connection (default 30s)
      initialization-fail-timeout: 0 # don't fail startup if DB is temporarily down
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

agent:
  ollama:
    base-url: http://ollama:11434/
    model: llama3:8b
    temperature: 0.1   # baixa temperatura para maior determinismo nas execuções
    top-p: 0.9         # nucleus sampling
    seed: 42           # semente para reproducibilidade (quando suportado pelo modelo)
    timeout-seconds: 300
  services:
    order:      http://localhost:8081
    payment:    http://localhost:8082
    inventory:  http://localhost:8083
    notification: http://localhost:8084
    gateway:    http://localhost:8080
  observability:
    prometheus-url: http://localhost:9090
    loki-url:       http://localhost:3100
  rabbitmq:
    mgmt-url: http://localhost:15672
    user: poc
    pass: poc123

logging:
  level:
    br.ufla.poc: DEBUG
    dev.langchain4j: DEBUG
